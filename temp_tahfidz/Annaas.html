<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Tahfidz Interaktif – الناس (114) آيات 1–6</title>
  <style>
    body {
      font-family: 'Scheherazade New','Amiri','Traditional Arabic',serif;
      background:#f7fafc;
      padding: 24px;
      line-height: 1.6;
      color:#111827;
    }
    h1{ text-align:center; margin-bottom: 8px; }
    .sub { text-align:center; margin-bottom: 22px; font-size: 14px; color:#374151; }
    .ayat-card{
      background:#ffffff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      padding:18px;
      margin:14px auto;
      max-width: 840px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .header{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px;
    }
    .badge{
      background:#111827; color:#fff; border-radius:999px; padding:6px 12px; font-size:14px; white-space:nowrap;
    }
    .title{ font-size:22px; font-weight:600; }
    .ayatText{
      text-align:center; font-size:32px; margin:12px 0 14px 0;
    }
    audio{ width:100%; max-width: 560px; display:block; margin: 0 auto 8px auto; }
    .controls{ text-align:center; margin-bottom: 6px; }
    button{
      margin:6px; padding:10px 16px; font-size:16px; border:none; border-radius:10px; cursor:pointer;
    }
    .btn-start{ background:#2563eb; color:#fff; }
    .btn-check{ background:#16a34a; color:#fff; display:none; }
    .btn-replay{ background:#6b7280; color:#fff; }
    .container{
      display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top: 12px; min-height:64px;
    }
    .word{
      background:#fff; border:1px solid #e5e7eb; padding:10px 14px; border-radius:10px;
      cursor:grab; font-size:28px; user-select:none; box-shadow:0 1px 2px rgba(0,0,0,0.06);
    }
    .result{ text-align:center; margin-top: 10px; font-size:18px; font-weight:700; min-height:24px; }
    .grid{ display:grid; gap: 10px; }
    @media(min-width:900px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <h1>🧩 Game Tahfidz Interaktif – الناس (114)</h1>
  <div class="sub">Klik ▶️ dengarkan ayat → tekan <b>“Mulai Latihan”</b> → susun kata sesuai urutan → <b>Cek Jawaban</b>.</div>

  <div id="app" class="grid">
    <!-- Ayat 1 -->
    <section class="ayat-card" data-ayat="1"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114001.mp3"
             data-lafadz='["قُلْ","أَعُوذُ","بِرَبِّ","النَّاسِ"]'
             data-text="قُلْ أَعُوذُ بِرَبِّ النَّاسِ">
      <div class="header">
        <span class="badge">آية 1</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>

    <!-- Ayat 2 -->
    <section class="ayat-card" data-ayat="2"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114002.mp3"
             data-lafadz='["مَلِكِ","النَّاسِ"]'
             data-text="مَلِكِ النَّاسِ">
      <div class="header">
        <span class="badge">آية 2</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>

    <!-- Ayat 3 -->
    <section class="ayat-card" data-ayat="3"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114003.mp3"
             data-lafadz='["إِلَٰهِ","النَّاسِ"]'
             data-text="إِلَٰهِ النَّاسِ">
      <div class="header">
        <span class="badge">آية 3</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>

    <!-- Ayat 4 -->
    <section class="ayat-card" data-ayat="4"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114004.mp3"
             data-lafadz='["مِن","شَرِّ","الْوَسْوَاسِ","الْخَنَّاسِ"]'
             data-text="مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ">
      <div class="header">
        <span class="badge">آية 4</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>

    <!-- Ayat 5 -->
    <section class="ayat-card" data-ayat="5"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114005.mp3"
             data-lafadz='["الَّذِي","يُوَسْوِسُ","فِي","صُدُورِ","النَّاسِ"]'
             data-text="الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ">
      <div class="header">
        <span class="badge">آية 5</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>

    <!-- Ayat 6 -->
    <section class="ayat-card" data-ayat="6"
             data-audio="https://everyayah.com/data/Alafasy_64kbps/114006.mp3"
             data-lafadz='["مِنَ","الْجِنَّةِ","وَالنَّاسِ"]'
             data-text="مِنَ الْجِنَّةِ وَالنَّاسِ">
      <div class="header">
        <span class="badge">آية 6</span>
        <div class="title">الناس</div>
      </div>
      <div class="ayatText" data-role="display"></div>
      <audio controls data-role="audio"></audio>
      <div class="controls">
        <button class="btn-replay" data-role="replay">🔁 Putar Ulang</button>
        <button class="btn-start" data-role="start">🎯 Mulai Latihan</button>
        <button class="btn-check" data-role="check">Cek Jawaban</button>
      </div>
      <div class="container" data-role="container" aria-live="polite"></div>
      <div class="result" data-role="result" role="status"></div>
    </section>
  </div>

  <script>
    // Inisialisasi setiap section ayat secara generik
    document.querySelectorAll('.ayat-card').forEach(initAyatCard);

    function initAyatCard(card){
      const display = card.querySelector('[data-role="display"]');
      const audioEl = card.querySelector('[data-role="audio"]');
      const btnReplay = card.querySelector('[data-role="replay"]');
      const btnStart = card.querySelector('[data-role="start"]');
      const btnCheck = card.querySelector('[data-role="check"]');
      const container = card.querySelector('[data-role="container"]');
      const result = card.querySelector('[data-role="result"]');

      const ayatText = card.getAttribute('data-text');
      const audioSrc = card.getAttribute('data-audio');
      const lafadzAsli = JSON.parse(card.getAttribute('data-lafadz'));

      display.textContent = ayatText;
      audioEl.querySelector('source')?.remove(); // bersihkan jika ada
      const src = document.createElement('source');
      src.src = audioSrc; src.type = 'audio/mpeg';
      audioEl.appendChild(src);
      audioEl.load();

      // Tampilkan tombol Mulai setelah audio selesai diputar 1x
      audioEl.onended = () => { btnStart.style.display = 'inline-block'; };

      btnReplay.addEventListener('click', () => { audioEl.currentTime = 0; audioEl.play(); });

      btnStart.addEventListener('click', () => {
        btnStart.style.display = 'none';
        display.style.display = 'none';
        btnCheck.style.display = 'inline-block';
        container.innerHTML = '';
        result.textContent = '';

        const acak = shuffleArray([...lafadzAsli]);
        acak.forEach((word, idx) => {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = word;
          span.draggable = true;
          span.id = `w-${card.dataset.ayat}-${idx}`;

          span.addEventListener('dragstart', e => {
            e.dataTransfer.setData('text/plain', e.target.id);
          });
          span.addEventListener('dragover', e => e.preventDefault());
          span.addEventListener('drop', e => {
            e.preventDefault();
            const draggedId = e.dataTransfer.getData('text/plain');
            const draggedEl = document.getElementById(draggedId);
            const targetEl = e.target;
            if(targetEl.classList.contains('word')){
              const temp = document.createElement('span');
              temp.className='word'; temp.style.display='none';
              container.insertBefore(temp, targetEl);
              container.insertBefore(draggedEl, targetEl);
              container.removeChild(temp);
            }
          });

          container.appendChild(span);
        });

        // Simpan urutan benar di dataset untuk pengecekan
        card.dataset.answer = lafadzAsli.join(' ');
      });

      btnCheck.addEventListener('click', () => {
        const hasil = Array.from(container.children).map(el => el.textContent.trim()).join(' ');
        const benar = hasil === card.dataset.answer;
        result.textContent = benar ? '✅ Benar' : '❌ Coba lagi ya';
        result.style.color = benar ? 'green' : 'red';
      });
    }

    function shuffleArray(a){
      for(let i=a.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
      }
      return a;
    }
  </script>
</body>
</html>
