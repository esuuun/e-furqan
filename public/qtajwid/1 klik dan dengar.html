    <!-- Google Fonts -->
    <link

        rel="stylesheet">
    <style>
        :root {
            --primary-color: #EAB308;
            --primary-dark: #CA8A04;
            --accent-color: #FDE047;
            --bg-gradient: linear-gradient(135deg, #FEFCE8 0%, #ffffff 50%, #FEF9C3 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: 1px solid rgba(234, 179, 8, 0.2);
            --text-color: #1F2937;
            --text-muted: #6B7280;
            --success: #EAB308;
            --error: #EF4444;
            --font-arabic: 'Amiri', 'Traditional Arabic', serif;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-ui);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-color);
            direction: rtl;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 95%;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            margin-top: 0;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .sound-button {
            padding: 15px;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: var(--font-arabic);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border-radius: 16px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-button:hover {
            border-color: var(--primary-color);
            background: rgba(252, 211, 77, 0.1);
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
            color: var(--accent-color);
        }

        .sound-button:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .button-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

    <audio id="audio-player"></audio>

    <script>
        // Menunggu sampai semua konten HTML selesai dimuat
        document.addEventListener('DOMContentLoaded', () => {

            const buttons = document.querySelectorAll('.sound-button');
            const audioPlayer = document.getElementById('audio-player');

            // --- Robust Audio Function (Synced with script.js) ---
            function playSound(soundName, arabicText) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;

                const audioPath = `audio/${soundName}.mp3`;
                audioPlayer.src = audioPath;

                showAudioToast('Memuat...', 'info');

                const playPromise = audioPlayer.play();

                if (playPromise !== undefined) {
                    playPromise
                        .then(() => showAudioToast('Memutar', 'success'))
                        .catch(err => {
                            console.warn(`Local audio missing for: ${soundName}. Trying TTS...`);
                            if (arabicText) {
                                showAudioToast('Mengambil dari Google...', 'warning');
                                playTTS(arabicText, audioPlayer);
                            } else {
                                showAudioToast('Audio tidak ditemukan', 'error');
                            }
                        });
                }
            }

            function playTTS(text, player) {
                const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(text)}`;
                player.src = ttsUrl;
                player.play()
                    .then(() => showAudioToast('Info: Menggunakan TTS (Online)', 'success'))
                    .catch(e => {
                        console.error("TTS Error:", e);
                        showAudioToast('Gagal memutar. Cek internet!', 'error');
                    });
            }

            // --- Toast Feedback ---
            function showAudioToast(msg, type) {
                let toast = document.getElementById('audio-toast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'audio-toast';
                    Object.assign(toast.style, {
                        position: 'fixed',
                        bottom: '50px',
                        left: '50%',
                        transform: 'translateX(-50%)',
                        backgroundColor: '#1E293B',
                        color: '#fff',
                        padding: '10px 20px',
                        borderRadius: '30px',
                        boxShadow: '0 4px 10px rgba(0,0,0,0.3)',
                        zIndex: '10000',
                        fontSize: '0.9rem',
                        transition: 'opacity 0.3s ease',
                        opacity: '0',
                        pointerEvents: 'none',
                        whiteSpace: 'nowrap'
                    });
                    document.body.appendChild(toast);
                }

                if (type === 'error') toast.style.backgroundColor = '#EF4444';
                else if (type === 'warning') toast.style.backgroundColor = '#F59E0B';
                else toast.style.backgroundColor = '#EAB308';

                toast.textContent = msg;
                toast.style.opacity = '1';

                if (window.audioToastTimeout) clearTimeout(window.audioToastTimeout);
                window.audioToastTimeout = setTimeout(() => {
                    toast.style.opacity = '0';
                }, 2000);
            }

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const soundName = button.dataset.sound;
                    const arabicText = button.dataset.text;

                    // Visual feedback on button
                    button.style.borderColor = 'var(--primary-color)';
                    button.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                    setTimeout(() => {
                        button.style.borderColor = '';
                        button.style.backgroundColor = '';
                    }, 300);

                    playSound(soundName, arabicText);
                });
            });

        });
    </script>
