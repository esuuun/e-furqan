            --glass-border: 1px solid rgba(234, 179, 8, 0.2);
            --text-color: #1F2937;
            --text-muted: #6B7280;
            --success: #EAB308;
            --error: #EF4444;

        body {

            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-color);
            direction: rtl;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: 700;

        p {

            font-size: 1.1rem;

            font-size: 3rem;

            font-family: var(--font-arabic);

            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;

            background: rgba(0, 0, 0, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            flex-direction: row-reverse;
            /* Agar susunan huruf kanan-ke-kiri */
        }

        .drop-zone {
            width: 70px;
            height: 70px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            font-family: var(--font-arabic);
            color: var(--accent-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drop-zone.drag-over {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--primary-color);
            transform: scale(1.1);
        }

        .drop-zone .drag-item {
            margin: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        /* Area Sumber (Huruf yang bisa di-drag/klik) */
        .drag-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            min-height: 100px;
        }

        .drag-item {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-family: var(--font-arabic);
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
            user-select: none;
        }

        .drag-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary-color);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .drag-item:active {
            cursor: grabbing;
        }

        .dragging {
            opacity: 0.5;
            transform: scale(0.9);
        }

        /* Tombol Kontrol */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 12px 25px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
            font-family: var(--font-ui);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #next-button {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        #next-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }

        #next-button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
        }

        #reset-button,

            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);

            border-color: var(--text-color);

            align-items: center;

            function removeTanwin(text) {
                return text.replace(/[ًٌٍ]/g, '');
            }

                return text.replace(/[ًٌٍَُِّْ¹²]/g, '');

            // --- FUNGSI SPLIT KATA MENJADI HURUF SATU-SATU ---
            function createWordPieces(arabicWord) {
                arabicWord = removeTanwin(arabicWord);

                const pieces = [];
                let i = 0;

                while (i < arabicWord.length) {
                    let currentChar = arabicWord[i];

                    if (/[ًٌٍ]/.test(currentChar)) {
                        i++;
                        continue;
                    }

                    if (/[َُِّْ]/.test(currentChar)) {
                        i++;
                        continue;
                    }

                    let piece = currentChar;

                    if (i + 1 < arabicWord.length && /[َُِّْ]/.test(arabicWord[i + 1])) {
                        piece += arabicWord[i + 1];
                        i++;
                    }

                    pieces.push({
                        text: piece,
                        value: `piece_${pieces.length}_${piece}`
                    });

                    i++;
                }

                return pieces;
            }

                'وَرَدَ': 'datang', 'ذَرَأَ': 'menciptakan', 'فَزِعَ': 'ketakutan', 'نَزَغَ': 'menghasut',
                'شَرَحَ': 'melapangkan', 'حَسَدَ': 'dengki', 'زَهَقَ': 'hancur', 'شَرَعَ': 'mensyariatkan',
                'عَقَرَ': 'menyembelih', 'نَفِدَ': 'habis', 'أَفَلَ': 'terbenam', 'مَرَجَ': 'melepas',
                'خَرَقَ': 'merobek', 'سَخِطَ': 'murka', 'صَدَفَ': 'berpaling', 'عَبَسَ': 'bermuka masam',
                'رَدِفَ': 'mengikuti', 'كُبِتَ': 'dipermalukan', 'نُقِرَ': 'ditiup', 'بَسَرَ': 'masam',
                'عُثِرَ': 'mengetahui', 'نَكَصَ': 'mundur', 'وَسَقَ': 'mengumpulkan', 'أَبَقَ': 'lari',
                'بَرِقَ': 'kilat', 'سَكَتَ': 'diam', 'شَجَرَ': 'bertengkar', 'شَغَفَ': 'cinta',
                'وَقَبَ': 'menembus', 'وَكَزَ': 'memukul'
            };

            // Buat wordList awal
            let originalWordList = rawWords.map((item) => {
                const cleanWord = removeTanwin(item.word);
                const audioName = removeAllHarakat(cleanWord).replace(/\s+/g, '_');

                return {
                    word: cleanWord,
                    meaning: meanings[item.word] || 'kata Arab',
                    audio: audioName,
                    pieces: createWordPieces(item.word)
                };
            });

            // Wordlist yang bisa diacak
            let wordList = [...originalWordList];
            let currentWord = null;
            let currentWordIndex = 0;
            let draggedItem = null;

            // --- Elemen DOM ---
            const dropContainer = document.getElementById('drop-container');
            const dragContainer = document.getElementById('drag-container');
            const targetWordDisplay = document.getElementById('target-word-display');
            const wordMeaningDisplay = document.getElementById('word-meaning');
            const feedbackEl = document.getElementById('feedback');
            const resetButton = document.getElementById('reset-button');
            const nextButton = document.getElementById('next-button');
            const shuffleButton = document.getElementById('shuffle-button');
            const audioPlayer = document.getElementById('audio-player');
            const wordCounter = document.getElementById('word-counter');

            // --- FUNGSI UTAMA ---
            function setupWord(index) {
                if (index >= wordList.length) {
                    index = 0;
                    currentWordIndex = 0;
                }

                currentWord = wordList[index];

                wordCounter.textContent = `Kata ${index + 1} dari ${wordList.length}`;
                targetWordDisplay.textContent = ` ${currentWord.word}`;
                wordMeaningDisplay.textContent = `Artinya: ${currentWord.meaning}`;
                dropContainer.innerHTML = '';
                dragContainer.innerHTML = '';
                feedbackEl.textContent = '';
                nextButton.disabled = true;

                currentWord.pieces.forEach((piece, i) => {
                    const dropZone = document.createElement('div');
                    dropZone.className = 'drop-zone';
                    dropZone.dataset.correctValue = piece.value;
                    dropZone.dataset.index = i;
                    dropContainer.appendChild(dropZone);
                });

                const shuffledPieces = [...currentWord.pieces].sort(() => 0.5 - Math.random());
                shuffledPieces.forEach(piece => {
                    const dragItem = document.createElement('div');
                    dragItem.className = 'drag-item';
                    dragItem.textContent = piece.text;
                    dragItem.dataset.value = piece.value;
                    dragItem.draggable = true;
                    dragContainer.appendChild(dragItem);
                });

                addDragListeners();
            }

            // --- FUNGSI EVENT DRAG & DROP ---
            function addDragListeners() {
                const dragItems = document.querySelectorAll('.drag-item');
                const dropZones = document.querySelectorAll('.drop-zone');

                dragItems.forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        draggedItem = e.target;
                        e.dataTransfer.setData('text/plain', e.target.dataset.value);
                        setTimeout(() => e.target.classList.add('dragging'), 0);
                    });

                    item.addEventListener('dragend', (e) => {
                        e.target.classList.remove('dragging');
                    });
                });

                dropZones.forEach(zone => {
                    zone.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (!zone.hasChildNodes()) {
                            zone.classList.add('drag-over');
                        }
                    });

                    zone.addEventListener('dragleave', () => {
                        zone.classList.remove('drag-over');
                    });

                    zone.addEventListener('drop', (e) => {
                        e.preventDefault();
                        zone.classList.remove('drag-over');

                        if (!zone.hasChildNodes()) {
                            zone.appendChild(draggedItem);
                            zone.dataset.droppedValue = draggedItem.dataset.value;
                            checkAnswer();
                        }
                    });
                });

                dragContainer.addEventListener('dragover', (e) => e.preventDefault());
                dragContainer.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (draggedItem && !dragContainer.contains(draggedItem.parentElement)) {
                        dragContainer.appendChild(draggedItem);
                        const oldZone = document.querySelector(`[data-dropped-value="${draggedItem.dataset.value}"]`);
                        if (oldZone) {
                            oldZone.dataset.droppedValue = '';
                        }
                    }
                });
            }

            // --- FUNGSI CEK JAWABAN ---
            function checkAnswer() {
                const dropZones = document.querySelectorAll('.drop-zone');

                let allFilled = true;
                dropZones.forEach(zone => {
                    if (!zone.hasChildNodes()) {
                        allFilled = false;
                    }
                });

                if (!allFilled) return;

                let isCorrect = true;
                dropZones.forEach(zone => {
                    if (zone.dataset.droppedValue !== zone.dataset.correctValue) {
                        isCorrect = false;
                    }
                });

                if (isCorrect) {
                    feedbackEl.textContent = '✓ Benar! (Masha Allah)';
                    feedbackEl.className = 'correct';
                    nextButton.disabled = false;
                    playSound(currentWord.audio, currentWord.word);
                } else {
                    feedbackEl.textContent = '✗ Belum tepat. Coba susun ulang.';
                    feedbackEl.className = 'wrong';
                }
            }

            // --- FUNGSI PLAY SOUND ---
            function playSound(soundName, arabicText) {
                audioPlayer.src = `audio/${soundName}.mp3`;
                audioPlayer.play().catch(e => {
                    console.warn('Audio lokal tidak tersedia, mencoba TTS...');
                    const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(arabicText)}`;
                    audioPlayer.src = ttsUrl;
                    audioPlayer.play().catch(err => console.error("Error TTS:", err));
                });
            }

            // --- KONTROL TOMBOL ---
            resetButton.addEventListener('click', () => {
                setupWord(currentWordIndex);
            });

            nextButton.addEventListener('click', () => {
                currentWordIndex++;
                if (currentWordIndex >= wordList.length) {
                    currentWordIndex = 0;
                }
                setupWord(currentWordIndex);
            });

            // --- TOMBOL ACAK URUTAN ---
            shuffleButton.addEventListener('click', () => {
                // Acak wordList
                wordList = shuffleArray(originalWordList);
                // Reset ke kata pertama
                currentWordIndex = 0;
                setupWord(currentWordIndex);
                // Tampilkan notifikasi
                feedbackEl.textContent = '🔀 Urutan kata telah diacak!';
                feedbackEl.className = '';
                feedbackEl.style.color = '#17a2b8';
                setTimeout(() => {
                    feedbackEl.textContent = '';
                }, 2000);
            });

            // --- MULAI PERMAINAN ---
            setupWord(currentWordIndex);

        });
    </script>
