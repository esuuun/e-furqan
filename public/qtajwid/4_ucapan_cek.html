<!DOCTYPE html>
<html lang="id" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 4: Ucapkan & Cek</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #EAB308;
            --primary-dark: #CA8A04;
            --accent-color: #FDE047;
            --bg-gradient: linear-gradient(135deg, #FEFCE8 0%, #ffffff 50%, #FEF9C3 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: 1px solid rgba(234, 179, 8, 0.2);
            --text-color: #1F2937;
            --text-muted: #6B7280;
            --success: #EAB308;
            --error: #EF4444;
            --font-arabic: 'Amiri', 'Traditional Arabic', serif;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-ui);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-color);
            direction: rtl;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 20px;
            margin-top: 0;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Tampilan Target yang harus diucapkan */
        .target-display {
            margin: 30px 0;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            position: relative;
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }

        .target-display:hover {
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        #target-text {
            font-size: 6rem;
            font-weight: bold;
            color: var(--accent-color);
            font-family: var(--font-arabic);
            display: block;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        #play-target-sound {
            font-size: 1.5rem;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 10px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: absolute;
            top: 20px;
            left: 20px;
            /* RTL layout, so left is typical for icons */
        }

        #play-target-sound:hover {
            background: var(--primary-color);
            color: #1e1b4b;
            transform: scale(1.1);
        }

        /* Tombol Rekam Utama */
        #record-button {
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%);
            color: white;
            border: none;
            border-radius: 50px;
            margin: 20px 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-ui);
        }

        #record-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.6);
        }

        #record-button:active {
            transform: scale(0.95);
        }

        #record-button.listening {
            background: linear-gradient(135deg, #EAB308 0%, #CA8A04 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        /* Animasi pulse */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        #next-button {
            padding: 20px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            margin-top: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: all 0.3s;
            font-family: var(--font-ui);
        }

        #next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }

        /* Status & Hasil */
        #status-message {
            font-size: 1rem;
            color: var(--text-muted);
            height: 20px;
            margin: 15px 0;
            font-weight: 500;
        }

        #result-display {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 50px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 10px;
        }

        .correct {
            color: #6EE7B7;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            width: 100%;
        }

        .wrong {
            color: #FCA5A5;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 100%;
        }

        #browser-warning {
            display: none;
            background: rgba(252, 211, 77, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Modul 4: Ucapkan & Cek</h1>
        <p>Ucapkan huruf yang muncul di layar setelah menekan tombol "Mulai Bicara".</p>

        <div id="browser-warning">
            Browser Anda tidak mendukung Web Speech API. Harap gunakan Google Chrome atau Safari.
        </div>

        <div class="target-display">
            <span id="target-text">...</span>
            <button id="play-target-sound" title="Dengarkan contoh">🔊</button>
        </div>

        <button id="record-button">🎙️ Mulai Bicara</button>
        <button id="next-button">Kata Berikutnya ❯</button>

        <div id="status-message">Klik tombol untuk memulai</div>
        <div id="result-display"></div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- DATABASE TARGET UCAPAN ---
            // Kita pakai database dari Modul 2
            const allSounds = [
                { text: 'أَ', sound: 'a' },
                { text: 'بَ', sound: 'ba' },
                { text: 'تَ', sound: 'ta' },
                { text: 'ثَ', sound: 'tsa' }, // Penting untuk dibedakan dengan 'sa'
                { text: 'جَ', sound: 'ja' },
                { text: 'حَ', sound: 'ha_h' }, // Perlu audio 'ha' (beda dari 'kha')
                { text: 'خَ', sound: 'kho' }, // Perlu audio 'kho'
                { text: 'دَ', sound: 'da' },
                { text: 'ذَ', sound: 'dza' }, // Penting untuk dibedakan dengan 'za'
                { text: 'رَ', sound: 'ro' },
                { text: 'زَ', sound: 'za' },
                { text: 'سَ', sound: 'sa' },
                { text: 'شَ', sound: 'sya' },
                { text: 'صَ', sound: 'sho' }, // Emphatic S
                { text: 'ضَ', sound: 'dho' }, // Emphatic D
                { text: 'طَ', sound: 'tho' }, // Emphatic T
                { text: 'ظَ', sound: 'zho' }, // Emphatic Z
                { text: 'عَ', sound: 'ain' }, // Ain
                { text: 'غَ', sound: 'ghain' },
                { text: 'فَ', sound: 'fa' },
                { text: 'قَ', sound: 'qof' },
                { text: 'كَ', sound: 'kaf' },
                { text: 'لَ', sound: 'lam' },
                { text: 'مَ', sound: 'mim' },
                { text: 'نَ', sound: 'nun' },
                { text: 'هَ', sound: 'ha' },
                { text: 'وَ', sound: 'waw' },
                { text: 'يَ', sound: 'ya' }
            ];

            // --- ELEMEN DOM ---
            const targetTextEl = document.getElementById('target-text');
            const playSoundButton = document.getElementById('play-target-sound');
            const recordButton = document.getElementById('record-button');
            const nextButton = document.getElementById('next-button');
            const statusMessageEl = document.getElementById('status-message');
            const resultDisplayEl = document.getElementById('result-display');
            const browserWarning = document.getElementById('browser-warning');
            const audioPlayer = document.getElementById('audio-player');

            let currentTarget = null;
            let recognition = null; // Ini adalah objek API-nya

            // --- 1. INISIALISASI SPEECH RECOGNITION ---

            // Cek dukungan browser
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                // Jika tidak didukung, tampilkan peringatan dan nonaktifkan tombol
                browserWarning.style.display = 'block';
                recordButton.disabled = true;
                nextButton.disabled = true;
                return; // Hentikan eksekusi script
            }

            // Buat instance baru
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // Set bahasa ke Arab (Saudi Arabia)
            recognition.interimResults = false; // Kita hanya mau hasil akhir
            recognition.maxAlternatives = 1; // Cukup 1 tebakan terbaik

            // --- 2. FUNGSI LOGIKA APLIKASI ---

            function setupNewRound() {
                // Pilih target acak dari database
                currentTarget = allSounds[Math.floor(Math.random() * allSounds.length)];

                targetTextEl.textContent = currentTarget.text;
                resultDisplayEl.textContent = '';
                statusMessageEl.textContent = 'Klik tombol untuk memulai';
                recordButton.disabled = false;
                recordButton.classList.remove('listening');
            }

            function playSound(soundName) {
                audioPlayer.src = `audio/${soundName}.mp3`;
                audioPlayer.play().catch(e => console.error("Audio error:", e));
            }

            /**
             * PENTING: Fungsi Normalisasi
             * API mungkin mengembalikan "قا" (dengan alif) saat mendengar "قَ" (fathah).
             * Fungsi ini menghapus semua harakat/tashkeel agar perbandingannya adil.
             */
            function normalizeArabic(text) {
                if (!text) return '';

                // Hapus semua Fathah, Kasrah, Dhammah, Tanwin, Sukun, Tasydid
                let normalized = text.replace(/[\u064B-\u0652]/g, '');

                // Normalkan bentuk Alif (ا, أ, إ, آ) menjadi (ا)
                normalized = normalized.replace(/[أإآ]/g, 'ا');

                // Hapus spasi di awal/akhir
                return normalized.trim();
            }

            function checkAnswer(transcript) {
                const normalizedTranscript = normalizeArabic(transcript);
                const normalizedTarget = normalizeArabic(currentTarget.text);

                console.log(`Target: ${normalizedTarget}, Hasil: ${normalizedTranscript}`);

                if (normalizedTranscript === normalizedTarget) {
                    resultDisplayEl.textContent = `Benar! (Terdengar: ${transcript})`;
                    resultDisplayEl.className = 'correct';
                    // Putar suara "Benar" jika ada
                } else {
                    resultDisplayEl.textContent = `Belum tepat. (Terdengar: ${transcript})`;
                    resultDisplayEl.className = 'wrong';
                }
            }

            // --- 3. EVENT HANDLER UNTUK SPEECH API ---

            // Saat rekaman dimulai
            recognition.onstart = () => {
                statusMessageEl.textContent = 'Mendengarkan... 👂';
                recordButton.classList.add('listening');
                recordButton.disabled = true; // Nonaktifkan selama merekam
            };

            // Saat rekaman selesai
            recognition.onend = () => {
                statusMessageEl.textContent = 'Selesai merekam. Memproses...';
                recordButton.classList.remove('listening');
                recordButton.disabled = false; // Aktifkan kembali
            };

            // Saat hasil didapatkan
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                checkAnswer(transcript);
            };

            // Saat terjadi error
            recognition.onerror = (event) => {
                if (event.error === 'no-speech') {
                    statusMessageEl.textContent = 'Tidak ada suara terdeteksi. Coba lagi.';
                } else if (event.error === 'not-allowed') {
                    statusMessageEl.textContent = 'Izin mikrofon ditolak. Harap izinkan di pengaturan browser.';
                } else {
                    statusMessageEl.textContent = `Error: ${event.error}`;
                }
            };

            // --- 4. EVENT LISTENER UNTUK TOMBOL ---

            recordButton.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {
                    console.error("Error memulai rekaman:", e);
                    statusMessageEl.textContent = "Error. Mungkin rekaman sudah berjalan.";
                }
            });

            playSoundButton.addEventListener('click', () => {
                if (currentTarget) {
                    playSound(currentTarget.sound);
                }
            });

            nextButton.addEventListener('click', setupNewRound);

            // --- MULAI RONDE PERTAMA ---
            setupNewRound();

        });
    </script>

</body>

</html>
