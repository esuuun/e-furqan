<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirah Rasulullah - Al-Quran Tematik</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Thaana:wght@400;500;600;700&family=Noto+Sans+Tifinagh:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #e2e8f0;
            --card-bg: #111827;
            --card-border: #1e293b;
            --accent: #14b8a6;
            --accent-glow: rgba(20, 184, 166, 0.15);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            line-height: 1.7;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 50%);
            min-height: 100vh;
        }
        h1, h2, h3 {
            color: var(--text-color);
            text-align: center;
        }
        h1 { 
            font-size: 2.5rem; 
            margin-bottom: 2rem; 
            font-weight: 700; 
            letter-spacing: -0.025em; 
        }
        h1 span { color: var(--accent); }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 4rem;
        }

        /* Nav Container */
        .nav-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        .custom-select {
            flex: 1;
            min-width: 200px;
            background-color: var(--card-bg);
            color: #f8fafc;
            border: 1px solid var(--card-border);
            padding: 0.85rem 2.5rem 0.85rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,<svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1.5L6 6.5L11 1.5" stroke="%2314b8a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 12px;
            transition: all 0.3s ease;
        }
        .custom-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.2);
        }
        .custom-select:hover:not(:disabled) {
            border-color: #334155;
        }
        .custom-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Hint */
        .hint {
            text-align: center;
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            display: none; /* hidden by default until content loads */
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #1e293b;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #334155;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(148, 163, 184, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(148, 163, 184, 0); }
            100% { box-shadow: 0 0 0 0 rgba(148, 163, 184, 0); }
        }

        /* Content Area */
        #content-area {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sub Header Banner Card */
        .sub-header-banner-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2.5rem;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.12), rgba(15, 23, 42, 0.85));
            padding: 1.5rem 2rem;
            border-radius: 16px;
            border: 1px solid rgba(20, 184, 166, 0.25);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }
        .sub-header-info {
            flex: 1;
            text-align: left;
        }
        .sub-header-title {
            margin: 0 0 0.4rem 0;
            font-size: 1.55rem;
            font-weight: 700;
            color: #fbbf24;
            text-align: left;
            letter-spacing: -0.01em;
        }
        .sub-header-meta {
            font-size: 0.95rem;
            color: var(--accent);
            font-weight: 600;
        }
        .sub-header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .toggle-verses-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(13, 148, 136, 0.3));
            color: #5eead4;
            border: 1px solid rgba(20, 184, 166, 0.45);
            padding: 0.75rem 1.4rem;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), 0 0 15px rgba(20, 184, 166, 0.1);
            white-space: nowrap;
            user-select: none;
        }
        .toggle-verses-btn:hover {
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.35), rgba(13, 148, 136, 0.5));
            border-color: #2dd4bf;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 184, 166, 0.3);
        }
        .toggle-verses-btn.collapsed-mode {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.3));
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), 0 0 15px rgba(245, 158, 11, 0.15);
        }
        .toggle-verses-btn.collapsed-mode:hover {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(217, 119, 6, 0.5));
            border-color: #fcd34d;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
        }

        /* Uraian Group Card Styling */
        .uraian-group-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.7), rgba(15, 23, 42, 0.8));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 3.5rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .uraian-group-card:hover {
            border-color: rgba(20, 184, 166, 0.5);
            box-shadow: 0 15px 35px -5px rgba(20, 184, 166, 0.15);
        }
        .uraian-group-card.is-collapsed {
            margin-bottom: 1.25rem;
            padding: 1.25rem 1.75rem;
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.9), rgba(15, 23, 42, 0.95));
            border-color: rgba(51, 65, 85, 0.8);
        }
        .uraian-group-card.is-collapsed:hover {
            border-color: var(--accent);
            background: linear-gradient(145deg, rgba(20, 184, 166, 0.08), rgba(17, 24, 39, 0.95));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(20, 184, 166, 0.2);
        }

        .group-header-banner {
            border-bottom: 2px solid rgba(30, 41, 59, 0.8);
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
        }
        .uraian-group-card.is-collapsed .group-header-banner {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .group-header-left {
            flex: 1;
            text-align: left;
        }
        .group-title {
            font-size: 1.18rem;
            font-weight: 700;
            color: #ffffff;
            text-align: left;
            margin: 0.25rem 0 0.5rem 0;
            line-height: 1.4;
            letter-spacing: -0.01em;
        }
        .group-toggle-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.6);
            color: var(--accent);
            border: 1px solid rgba(51, 65, 85, 0.8);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
            margin-top: 0.25rem;
        }
        .group-header-banner:hover .group-toggle-icon {
            background: rgba(20, 184, 166, 0.2);
            border-color: var(--accent);
            color: #ffffff;
            transform: scale(1.08);
        }
        .uraian-group-card.is-collapsed .group-toggle-icon svg {
            transform: rotate(-90deg);
        }
        .uraian-group-card.is-collapsed .group-cards-container {
            display: none;
        }

        .group-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(13, 148, 136, 0.1));
            color: var(--accent);
            border: 1px solid rgba(20, 184, 166, 0.3);
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .group-meta {
            font-size: 0.88rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 2rem;
            display: inline-block;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
            text-align: left;
            color: #f8fafc;
        }

        .verse-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .verse-title::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            perspective: 1000px;
            margin-bottom: 3rem;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            display: grid;
        }
        .flip-card:hover .flip-card-front {
            border-color: #334155;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .flip-card-front, .flip-card-back {
            grid-area: 1 / 1 / 2 / 2;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            box-sizing: border-box;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .flip-card-front {
            background: linear-gradient(145deg, #0b1120, #0f172a);
            font-size: 1.15rem;
            text-align: center;
            color: #cbd5e1;
            flex-direction: column;
            gap: 1.5rem;
        }
        .translation-text {
            width: 100%;
            transition: all 0.3s ease;
        }
        .translation-text.lang-ur {
            direction: rtl;
            font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
            font-size: 1.35rem;
            line-height: 2.3;
            text-align: center;
        }
        .translation-text.lang-bn {
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-hi {
            font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-zh {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-ko {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
            word-break: keep-all;
        }
        .translation-text.lang-ja {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-th {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-ar {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.35rem;
            line-height: 2.3;
            text-align: center;
        }
        .translation-text.lang-ku {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            line-height: 2.2;
            text-align: center;
        }
        .translation-text.lang-ber {
            font-family: 'Noto Sans Tifinagh', 'Inter', sans-serif;
            font-size: 1.2rem;
            line-height: 2;
            letter-spacing: 0.02em;
        }
        .translation-text.lang-am {
            font-family: 'Noto Sans Ethiopic', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-dv {
            direction: rtl;
            font-family: 'Noto Sans Thaana', 'Inter', sans-serif;
            font-size: 1.25rem;
            line-height: 2.2;
            text-align: center;
        }
        .translation-text.lang-ta {
            font-family: 'Noto Sans Tamil', 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.9;
        }
        .translation-text.lang-ug {
            direction: rtl;
            font-family: 'Amiri', serif;
            font-size: 1.25rem;
            line-height: 2.2;
            text-align: center;
        }

        .flip-card-back {
            background: linear-gradient(145deg, #111827, #0f172a);
            transform: rotateY(180deg);
            font-family: 'Amiri', serif;
            font-size: 2.4rem;
            line-height: 2.2;
            direction: rtl;
            text-align: center;
            border-color: var(--accent);
            box-shadow: 0 0 40px var(--accent-glow);
            color: #f1f5f9;
        }
        
        .tts-button {
            background-color: rgba(20, 184, 166, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1.2s linear infinite;
        }
        .tts-button:hover {
            background-color: var(--accent);
            color: #0b1120;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .tts-button.is-playing {
            background-color: var(--accent);
            color: #0b1120;
            box-shadow: 0 0 15px var(--accent-glow);
            border-color: var(--accent);
        }
        .tts-button.ai-btn:hover {
            background-color: #8b5cf6;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }


        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-size: 1.1rem;
            margin-top: 4rem;
        }

        .nav-action-btn {
            flex: 1;
            min-width: 180px;
            padding: 1.1rem 1.5rem;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .primary-btn {
            background: linear-gradient(135deg, var(--accent), #0d9488);
            color: #0b0f19;
            box-shadow: 0 4px 20px rgba(20, 184, 166, 0.25);
        }
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(20, 184, 166, 0.45);
            background: linear-gradient(135deg, #16d3bf, #14b8a6);
        }
        .next-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.25);
        }
        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.45);
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
        }
        .secondary-btn {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .secondary-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            color: #f8fafc;
            border-color: #475569;
        }
        .secondary-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .translator-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            margin-top: 0.65rem;
            padding: 0.35rem 0.9rem;
            background: rgba(20, 184, 166, 0.08);
            border: 1px solid rgba(20, 184, 166, 0.25);
            border-radius: 9999px;
            font-size: 0.85rem;
            color: #94a3b8;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            max-width: 90%;
        }
        .translator-badge strong {
            color: #f8fafc;
            font-weight: 600;
        }
        .translator-badge svg {
            color: var(--accent);
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
            }
            .custom-select {
                width: 100%;
            }
            .flip-card-front { font-size: 1rem; padding: 2rem; }
            .flip-card-back { font-size: 1.8rem; padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Al-Quran <span>Tematik</span></h1>
        
        <div style="text-align: center; margin-bottom: 2rem; margin-top: -1rem;">
            <div style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; flex-wrap: wrap;">
                <label for="tts-language" style="color: #94a3b8; margin-right: 0.5rem; font-size: 0.95rem; font-weight: 500;">Bahasa Terjemahan & Suara:</label>
                <select id="tts-language" class="custom-select" style="min-width: 190px; padding: 0.5rem 2.5rem 0.5rem 1rem; font-size: 0.9rem;">
                    <option value="id-ID">🇮🇩 Indonesia</option>
                    <option value="ms-MY">🇲🇾 Bahasa Melayu (Malay)</option>
                    <option value="en-US">🇬🇧 English</option>
                    <option value="ur-PK">🇵🇰 اردو (Urdu)</option>
                    <option value="bn-BD">🇧🇩 বাংলা (Bangla)</option>
                    <option value="hi-IN">🇮🇳 हिन्दी (Hindi)</option>
                    <option value="ru-RU">🇷🇺 Русский (Russian)</option>
                    <option value="zh-CN">🇨🇳 中文 (Chinese)</option>
                    <option value="fr-FR">🇫🇷 Français</option>
                    <option value="es-ES">🇪🇸 Español</option>
                    <option value="pt-PT">🇵🇹 Português (Portuguese)</option>
                    <option value="it-IT">🇮🇹 Italiano (Italian)</option>
                    <option value="tr-TR">🇹🇷 Türkçe (Turkish)</option>
                    <option value="de-DE">🇩🇪 Deutsch (German)</option>
                    <option value="ko-KR">🇰🇷 한국어 (Korean)</option>
                    <option value="ja-JP">🇯🇵 日本語 (Japanese)</option>
                    <option value="th-TH">🇹🇭 ภาษาไทย (Thai)</option>
                    <option value="ha-NG">🇳🇬 Hausa</option>
                    <option value="sw-TZ">🇹🇿 Kiswahili (Swahili)</option>
                    <option value="bs-BA">🇧🇦 Bosanski (Bosnian)</option>
                    <option value="sq-AL">🇦🇱 Shqip (Albanian)</option>
                    <option value="ber-DZ">ⵣ ⵜⴰⵎⴰⵣⵉⵖⵜ (Amazigh)</option>
                    <option value="am-ET">🇪🇹 አማርኛ (Amharic)</option>
                    <option value="az-AZ">🇦🇿 Azərbaycan (Azerbaijani)</option>

                connErrorText: 'Ulanishda xatolik',
                emptySelect: 'Oyatlarni koʻrish uchun yuqoridagi toifani tanlang.',
                cssClass: '',
                aiPrompt: (surah, ayat, uraian, text) => `Qurʼon ${surah}:${ayat} oyatini "${uraian}" mavzusi kontekstida qisqacha tushuntirib bering: "${text}"`
            }
        };

        async function translateTextFree(text, targetLangCode) {
            if (!text || targetLangCode === 'id') return text;
            const cacheKey = `${targetLangCode}:${text}`;
            if (translationCache[cacheKey]) return translationCache[cacheKey];
            
            try {
                // Pre-processing to prevent Google Translate neural model hallucinations
                let queryText = text;
                // 1. Ensure space after numbering prefix (e.g., "5.KIKIR" -> "5. KIKIR")
                queryText = queryText.replace(/^(\d+(?:\.\d+)*)\.([^\s\d])/g, '$1. $2');
                // 2. Protect "(Bakhil)" by converting to "(Al-Bakhil)" so Google won't corrupt it into "Kakhil"
                queryText = queryText.replace(/\(Bakhil\)/gi, '(Al-Bakhil)');

                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=id&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(queryText)}`;
                const res = await fetch(url);
                const data = await res.json();
                let translated = data[0].map(item => item[0]).join('');

                // Post-processing: Correct any residual "Kakhil" hallucinations across various scripts/alphabets
                translated = translated
                    .replace(/\bKakhil\b/gi, match => match === 'KAKHIL' ? 'BAKHIL' : (match === 'Kakhil' ? 'Bakhil' : 'bakhil'))
                    .replace(/\(Kakhil\)/gi, match => match === '(KAKHIL)' ? '(BAKHIL)' : (match === '(Kakhil)' ? '(Bakhil)' : '(bakhil)'))
                    .replace(/الكخيل/g, 'البخيل')
                    .replace(/کاخیل/g, 'البخيل')
                    .replace(/কাখিল/g, 'আল-বাখিল')
                    .replace(/काखिल/g, 'अल-बखिल')
                    .replace(/кахил/gi, 'Аль-Бахиль');

                // Fix mis-translations for Kikir / Bakhil topic headers
                if (text.toUpperCase().includes('KIKIR (BAKHIL)') || text.toUpperCase().includes('KIKIR')) {
                    translated = translated
                        .replace(/MISERY\s*\(STORY\)/gi, 'STINGINESS (BAKHIL)')
                        .replace(/MISERING\s*\(Al-Bakhil\)/gi, 'STINGINESS (Al-Bakhil)')
                        .replace(/MIS[ÈE]RE\s*\(HISTOIRE\)/gi, 'AVARICE (BAKHIL)')
                        .replace(/MISERIA\s*\(HISTORIA\)/gi, 'AVARICIA (BAKHIL)')
                        .replace(/MISERIA\s*\(STORIA\)/gi, 'AVARIZIA (BAKHIL)')
                        .replace(/ELEND\s*\(GESCHICHTE\)/gi, 'GEIZ (BAKHIL)');
                }

                translationCache[cacheKey] = translated;
                return translated;
            } catch(e) {
                console.error("Translation error:", e);
                return text;
            }
        }

        async function translateDropdowns() {
            const langSelect = document.getElementById('tts-language');
            const lang = langSelect ? langSelect.value : 'id-ID';
            const cfg = LANG_CONFIG[lang] || LANG_CONFIG['id-ID'];
            const targetLangCode = cfg.code;
            
            const labelEl = document.querySelector('label[for="tts-language"]');
            if (labelEl && cfg.label) {
                labelEl.textContent = cfg.label;
            }

            const selects = [document.getElementById('select-tema'), document.getElementById('select-pokok'), document.getElementById('select-sub')];
            const promises = [];
            
            for (let select of selects) {
                if (!select) continue;
                for (let option of select.options) {
                    if (!option.hasAttribute('data-original')) {
                        option.setAttribute('data-original', option.textContent);
                    }
                    const originalText = option.getAttribute('data-original');
                    
                    if (targetLangCode === 'id') {
                        option.textContent = originalText;
                    } else {
                        const cacheKey = `${targetLangCode}:${originalText}`;
                        if (!translationCache[cacheKey]) {
                            option.textContent = '...';
                        }
                        promises.push((async () => {
                            const translated = await translateTextFree(originalText, targetLangCode);
                            option.textContent = translated;
                        })());
                    }
                }
            }
            await Promise.all(promises);
        }

        function naturalCompare(a, b) {
            return (a || '').toString().localeCompare((b || '').toString(), undefined, { numeric: true, sensitivity: 'base' });
        }

        function naturalSort(arr) {
            return [...arr].sort(naturalCompare);
        }

        function checkAutoNav() {

        let currentAudio = null;
        let onlineAudioQueue = [];
        let isAudioPlaying = false;
        let activeTtsButton = null;
        let currentUtterance = null;
        let speechSentences = [];
        let availableVoices = [];

        function loadVoices() {
            if (typeof window.speechSynthesis !== 'undefined') {
                availableVoices = window.speechSynthesis.getVoices() || [];
            }
        }
        loadVoices();
        if (typeof window.speechSynthesis !== 'undefined' && window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        function hasLocalVoice(langCode) {
            if (!availableVoices || availableVoices.length === 0) {
                loadVoices();
            }
            if (!availableVoices || availableVoices.length === 0) return false;
            const code = (langCode || '').toLowerCase().split('-')[0];
            return availableVoices.some(v => {
                const vl = (v.lang || '').toLowerCase().replace('_', '-');
                return vl.startsWith(code) || ((code === 'no' || code === 'nb') && (vl.startsWith('no') || vl.startsWith('nb')));
            });
        }

        function getBestVoice(selectedLang) {
            if (!availableVoices || availableVoices.length === 0) {
                loadVoices();
            }
            if (!availableVoices || availableVoices.length === 0) return null;

            const exactCode = (selectedLang || '').toLowerCase().replace('_', '-');
            const shortCode = exactCode.split('-')[0];

            // 1. Ambil seluruh voice yang cocok dengan bahasa terpilih
            const langVoices = availableVoices.filter(v => {
                const vl = (v.lang || '').toLowerCase().replace('_', '-');
                return vl === exactCode || vl.startsWith(shortCode) || ((shortCode === 'no' || shortCode === 'nb') && (vl.startsWith('no') || vl.startsWith('nb')));
            });

            if (langVoices.length === 0) return null;

            // 2. KONSISTENSI 1 JENIS SUARA: Prioritaskan Suara Perempuan (Female / Natural)
            // (Contoh: Microsoft Gadis, Microsoft Jenny, Google Bahasa Indonesia, Aria, Zira, Iselin, Nora, dll.)
            const femaleVoice = langVoices.find(v => 
                /gadis|jenny|aria|sonia|zira|siti|yasmin|amira|ayumi|yuna|xiaoxiao|denise|katja|elena|elsa|isabella|chiara|alice|bianca|carla|federica|lucia|premwadee|achara|iselin|nora|astrid|ingrid|liv|anne|kari|paulina|maja|zofia|ewa|agnieszka|alina|carmen|ioana|simona|maria|hillevi|hedda|elin|sofie|klara|alva|vani|latha|priya|siri|madina|dilnura|nodira|sevara|female|woman|natural/i.test(v.name)
            );
            if (femaleVoice) return femaleVoice;

            // 3. Prioritaskan penyedia kualitas tinggi (Google / Microsoft / Apple)
            const providerVoice = langVoices.find(v => /google|microsoft|apple/i.test(v.name));
            if (providerVoice) return providerVoice;

            // 4. Default ke suara pertama yang tersedia
            return langVoices[0];
        }

        function stopTTS(event) {
            if (event && event.stopPropagation) event.stopPropagation(); // Mencegah flip card
            
            isAudioPlaying = false;
            speechSentences = [];
            onlineAudioQueue = [];

            if (currentUtterance) {
                currentUtterance.onend = null;
                currentUtterance.onerror = null;
                currentUtterance = null;
            }

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            if (currentAudio) {
                currentAudio.onended = null;
                currentAudio.onerror = null;
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            
            if (activeTtsButton) {
                resetPlayButtonState(activeTtsButton);
                activeTtsButton = null;
            }

            document.querySelectorAll('.play-btn.is-playing').forEach(btn => {
                resetPlayButtonState(btn);
            });
        }

        function setPlayButtonPlayingState(btn) {
            if (!btn) return;
            const langSelect = document.getElementById('tts-language');
            const selectedLang = langSelect ? langSelect.value : 'id-ID';
            const cfg = LANG_CONFIG[selectedLang] || LANG_CONFIG['id-ID'];
            const spinnerSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="10" stroke-opacity="0.3"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor"></path></svg>`;
            btn.innerHTML = spinnerSvg + (cfg.stopText || cfg.playText);
            btn.classList.add('is-playing');
            btn.setAttribute('title', 'Klik untuk menghentikan suara');
        }

        function resetPlayButtonState(btn) {
            if (!btn) return;
            const langSelect = document.getElementById('tts-language');
            const selectedLang = langSelect ? langSelect.value : 'id-ID';
            const cfg = LANG_CONFIG[selectedLang] || LANG_CONFIG['id-ID'];
            const svg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
            btn.innerHTML = svg + cfg.playText;
            btn.classList.remove('is-playing');
            btn.setAttribute('title', 'Dengarkan Terjemahan');
            btn.style.backgroundColor = '';
            btn.style.color = '';
        }

        function splitTextIntoChunks(text, maxLen = 120) {
            if (!text) return [];
            if (text.length <= maxLen) return [text];

            const regex = /([^.?!,;:\n\u06d4\u0964]+[.?!,;:\n\u06d4\u0964]+|[^.?!,;:\n\u06d4\u0964]+$)/g;
            const parts = text.match(regex) || [text];
            const chunks = [];
            let current = '';

            for (let part of parts) {
                part = part.trim();
                if (!part) continue;
                if ((current + ' ' + part).trim().length <= maxLen) {
                    current = (current ? current + ' ' + part : part).trim();
                } else {
                    if (current) chunks.push(current);
                    if (part.length > maxLen) {
                        const words = part.split(/\s+/);
                        current = '';
                        for (let w of words) {
                            if ((current + ' ' + w).trim().length <= maxLen) {
                                current = (current ? current + ' ' + w : w).trim();
                            } else {
                                if (current) chunks.push(current);
                                current = w;
                            }
                        }
                    } else {
                        current = part;
                    }
                }
            }
            if (current) chunks.push(current);
            return chunks;
        }

        function playOnlineTTSQueue(chunks, langCode, button) {
            if (!chunks || chunks.length === 0) {
                stopTTS();
                return;
            }
            onlineAudioQueue = [...chunks];
            isAudioPlaying = true;
            activeTtsButton = button;

            setPlayButtonPlayingState(button);

            function playNext() {
                if (!isAudioPlaying || onlineAudioQueue.length === 0) {
                    stopTTS();
                    return;
                }
                const chunk = onlineAudioQueue.shift();
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${encodeURIComponent(langCode)}&q=${encodeURIComponent(chunk)}`;
                
                if (currentAudio) {
                    currentAudio.onended = null;
                    currentAudio.onerror = null;
                    currentAudio.pause();
                }

                currentAudio = new Audio(url);
                currentAudio.onended = () => {
                    if (isAudioPlaying) playNext();
                };
                currentAudio.onerror = (err) => {
                    console.warn("Online audio playback failed:", err);
                    if (isAudioPlaying) playNext();
                };
                currentAudio.play().catch(e => {
                    console.warn("Audio play() interrupted or rejected:", e);
                    if (isAudioPlaying && e.name !== 'AbortError') playNext();
                });
            }

            playNext();
        }

        function playNativeSpeechQueue(sentences, selectedLang, langCode, button) {
            speechSentences = [...sentences];
            isAudioPlaying = true;
            activeTtsButton = button;

            setPlayButtonPlayingState(button);

            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
            }

            let failedCount = 0;
            const chosenVoice = getBestVoice(selectedLang);

            function playNext() {
                if (!isAudioPlaying || speechSentences.length === 0) {
                    stopTTS();
                    return;
                }

                const sentence = speechSentences.shift();
                const utterance = new SpeechSynthesisUtterance(sentence);
                currentUtterance = utterance;
                utterance.lang = selectedLang;
                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }
                utterance.rate = 0.92;
                utterance.pitch = 1.0;

                let done = false;
                utterance.onend = () => {
                    if (!isAudioPlaying) return;
                    if (!done) {
                        done = true;
                        currentUtterance = null;
                        if (isAudioPlaying) playNext();
                    }
                };

                utterance.onerror = (e) => {
                    console.warn("SpeechSynthesis utterance error:", e);
                    // Jika dihentikan manual atau dibatalkan, jangan alihkan ke online TTS
                    if (!isAudioPlaying || e.error === 'interrupted' || e.error === 'canceled') {
                        currentUtterance = null;
                        return;
                    }
                    failedCount++;
                    if (!done) {
                        done = true;
                        currentUtterance = null;
                        // Jika gagal pada kalimat pertama karena tidak didukung, alihkan ke online TTS
                        if (failedCount === 1 && isAudioPlaying) {
                            speechSentences.unshift(sentence);
                            playOnlineTTSQueue(speechSentences, langCode, button);
                            return;
                        }
                        if (isAudioPlaying) playNext();
                    }
                };

                window.speechSynthesis.speak(utterance);
            }

            playNext();
        }

        function playTTS(button, event) {
            if (event) event.stopPropagation(); // Mencegah flip card saat tombol diklik
            
            // Jika tombol yang sama sedang memutar (atau tombol memiliki status is-playing), klik sekali lagi akan otomatis berhenti
            if (isAudioPlaying && (activeTtsButton === button || button.classList.contains('is-playing'))) {
                stopTTS();
                return;
            }

            stopTTS(); // Hentikan suara yang sedang berjalan di tempat lain

            // Hentikan pemutaran audio tilawah alquran jika sedang aktif
            document.querySelectorAll('audio').forEach(a => {
                if (!a.paused) a.pause();
            });

            const card = button.closest('.flip-card-front');
            let text = '';
            if (card) {
                const textEl = card.querySelector('.translation-text');
                if (textEl && textEl.textContent) {
                    text = textEl.textContent.trim();
                }
            }
            if (!text) {
                text = decodeURIComponent(button.getAttribute('data-text') || '');
            }
            if (!text) return;

            const langSelect = document.getElementById('tts-language');
            const selectedLang = langSelect ? langSelect.value : 'id-ID';
            const cfg = LANG_CONFIG[selectedLang] || LANG_CONFIG['id-ID'];
            const langCode = cfg.code;

            const chunks = splitTextIntoChunks(text, 140);
            if (chunks.length === 0) return;

            // Jika ada suara bawaan browser (seperti Bahasa Indonesia, Inggris), gunakan SpeechSynthesis native empuk.
            // Jika TIDAK ADA suara bawaan di sistem untuk bahasa ini (seperti Urdu, Bangla, Turki di Windows), gunakan Online TTS agar PASTI berbunyi lancar!
            if (window.speechSynthesis && hasLocalVoice(selectedLang)) {
                playNativeSpeechQueue(chunks, selectedLang, langCode, button);
            } else {
                playOnlineTTSQueue(chunks, langCode, button);
            }
        }



        function tanyaAI(button, event, uraianTitle) {
            if (event) event.stopPropagation(); // Mencegah flip card
            stopTTS();
            const card = button.closest('.flip-card-front');
            const surah = card.getAttribute('data-surah');

            const groupCard = button.closest('.uraian-group-card');
            let titleToUse = uraianTitle;
            if (groupCard) {
                const titleEl = groupCard.querySelector('.group-title');
                if (titleEl && titleEl.textContent) {
                    titleToUse = titleEl.textContent.trim();
                }
            }

            const prompt = cfg.aiPrompt ? cfg.aiPrompt(surah, ayat, titleToUse, currentText) : `Jelaskan singkat QS. ${surah}:${ayat} terkait "${titleToUse}": "${currentText}"`;
            
            const url = `https://chatgpt.com/?q=${encodeURIComponent(prompt)}`;
            window.open(url, '_blank');
        }

        }

        function nextSub() {
            stopTTS();
            // 1. Next Sub in current Pokok
            if (elSub && !elSub.disabled && elSub.selectedIndex < elSub.options.length - 1) {
                elSub.selectedIndex = elSub.selectedIndex + 1;
                elSub.dispatchEvent(new Event('change'));
                scrollToContent();
                return;
            }

            // 2. Next Pokok Bahasan
            if (elPokok && !elPokok.disabled && elPokok.selectedIndex < elPokok.options.length - 1) {
                elPokok.selectedIndex = elPokok.selectedIndex + 1;
                elPokok.dispatchEvent(new Event('change'));
                setTimeout(() => {
                    if (elSub.options.length > 1) {
                        elSub.selectedIndex = 1;
                        elSub.dispatchEvent(new Event('change'));
                        scrollToContent();
                    }
                }, 100);
                return;
            }

            // 3. Next Tema
            if (elTema && elTema.selectedIndex < elTema.options.length - 1) {
                elTema.selectedIndex = elTema.selectedIndex + 1;
                elTema.dispatchEvent(new Event('change'));
                setTimeout(() => {
                    if (elPokok.options.length > 1) {
                        elPokok.selectedIndex = 1;
                        elPokok.dispatchEvent(new Event('change'));
                        setTimeout(() => {
                            if (elSub.options.length > 1) {
                                elSub.selectedIndex = 1;
                                elSub.dispatchEvent(new Event('change'));
                                scrollToContent();
                            }
                        }, 100);
                    }
                }, 100);
            }
        }

        function prevUraian() { prevSub(); }
        function nextUraian() { nextSub(); }

        function scrollToContent() {
            setTimeout(() => {
                const elContent = document.getElementById('content-area');
                if (elContent) {
                    window.scrollTo({ top: elContent.offsetTop - 20, behavior: 'smooth' });
                }
            }, 80);
        }

        function updateNavButtonState() {
            const btnPrev = document.getElementById('btn-prev-uraian');
            if (btnPrev && elSub) {
                btnPrev.disabled = (elSub.selectedIndex <= 1);
            }
        }

        function toggleSingleGroup(groupIdx, event) {
            if (event && event.target && (event.target.closest('button') || event.target.closest('audio') || event.target.closest('.flip-card'))) {
                return;
            }
            const card = document.getElementById(`group-${groupIdx}`);
            if (!card) return;
            card.classList.toggle('is-collapsed');

            const groupCards = Array.from(document.querySelectorAll('.uraian-group-card'));
            const anyExpandedWithVerses = groupCards.some(c => {
                if (c.classList.contains('is-collapsed')) return false;
                const meta = c.querySelector('.group-meta');
                const count = meta ? parseInt(meta.getAttribute('data-count') || '0') : 0;
                return count > 0;
            });

            if (anyExpandedWithVerses) {
                elHint.style.display = 'flex';
            } else {
                elHint.style.display = 'none';
            }
        }

        function generateUraianGroupMarkup(uraianTitle, data, groupIdx) {
            let markup = `
                <div class="uraian-group-card is-collapsed" id="group-${groupIdx}">
                    <div class="group-header-banner" onclick="toggleSingleGroup(${groupIdx}, event)" title="Klik untuk Buka / Tutup Kelompok Ini">
                        <div class="group-header-left">
                            <h3 class="group-title" data-original="${uraianTitle}">${uraianTitle}</h3>
                            <div class="group-meta" data-count="${data && data.verses ? data.verses.length : 0}">
                                <span>📖 ${data && data.verses ? data.verses.length : 0} Ayat Al-Qur'an</span>
                            </div>
                        </div>
                        <div class="group-toggle-icon" title="Buka / Tutup Kelompok">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div class="group-cards-container">
            `;

            if (data.is_lihat_juga) {
                markup += `<div class="empty-state" style="padding: 1.5rem; text-align: left; background: rgba(30, 41, 59, 0.4); border-radius: 12px; margin-top: 1rem;">ℹ️ Lihat juga bahasan terkait pada referensi utama.</div>`;
            } else if (!data.verses || data.verses.length === 0) {
                markup += `<div class="empty-state" style="padding: 1.5rem; text-align: center;">Tidak ada ayat untuk kelompok uraian ini.</div>`;
            } else {
                data.verses.forEach(v => {
                    markup += `
                        <div class="verse-item-wrapper" style="margin-bottom: 2rem;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.5rem;">
                                <div class="verse-title" style="margin-bottom: 0;">${v.surah_name} [${v.surah_num}]: ${v.ayat_num}</div>
                                ${v.audio ? `
                                <audio controls style="height: 32px; border-radius: 999px;">
                                    <source src="${v.audio}" type="audio/mpeg">
                                </audio>
                                ` : ''}
                            </div>
                            <div class="flip-card" onclick="this.classList.toggle('flipped')">
                                <div class="flip-card-inner">
                                    <div class="flip-card-front" data-surah="${v.surah_num}" data-ayat="${v.ayat_num}" data-indo="${encodeURIComponent(v.indo)}">
                                        <div class="translation-text" style="width: 100%;">${v.indo}</div>
                                        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem;">
                                            <button class="tts-button play-btn" data-text="${encodeURIComponent(v.indo)}" onclick="playTTS(this, event)" title="Dengarkan Terjemahan">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                                                Dengarkan
                                            </button>
                                            <button class="tts-button ai-btn" style="color: #8b5cf6; border-color: #8b5cf6; background-color: rgba(139, 92, 246, 0.1);" onclick="tanyaAI(this, event, '${uraianTitle.replace(/'/g, "\\'")}')" title="Tanya AI tentang ayat ini">
                                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                                Tanya AI
                                            </button>
                                        </div>
                                    </div>
                                    <div class="flip-card-back">${v.arab}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            markup += `
                    </div>
                </div>
            `;
            return markup;
        }

        function renderContentAll(tema, pokok, sub) {
            saveCurrentState();
            const subData = quranData[tema] && quranData[tema][pokok] && quranData[tema][pokok][sub];
            if (!subData) return;
            const keys = naturalSort(Object.keys(subData));
            
            let html = `
                <div class="sub-header-banner-card">
                    <div class="sub-header-info">
                        <h2 class="sub-header-title" data-original="${sub}">${sub}</h2>
                        <div class="sub-header-meta" data-count="${keys.length}">Menampilkan ${keys.length} Kelompok Uraian Flash Card</div>
                    </div>
                </div>
            `;

            const navContainer = document.getElementById('bottom-nav-container');
            let totalVerses = 0;

            keys.forEach((uraianTitle, idx) => {
                const data = subData[uraianTitle];
                html += generateUraianGroupMarkup(uraianTitle, data, idx);
                if (data && data.verses) totalVerses += data.verses.length;
            });

            elHint.style.display = 'none';

            if (totalVerses > 0) {
                if (navContainer) navContainer.style.display = 'block';
            } else {
                if (navContainer) navContainer.style.display = 'none';
            }

            elContent.innerHTML = html;
            updateNavButtonState();
            translatePageContent();
        }

        function renderContentSingle(tema, pokok, sub, uraianTitle) {
            saveCurrentState();
            const subData = quranData[tema] && quranData[tema][pokok] && quranData[tema][pokok][sub];
            if (!subData || !subData[uraianTitle]) return;

            const data = subData[uraianTitle];
            const navContainer = document.getElementById('bottom-nav-container');

            let html = generateUraianGroupMarkup(uraianTitle, data, 0);

            elHint.style.display = 'none';

            if (data.verses && data.verses.length > 0) {
                if (navContainer) navContainer.style.display = 'block';
            } else {
                if (navContainer) navContainer.style.display = 'none';
            }

            elContent.innerHTML = html;
            updateNavButtonState();
            translatePageContent();
        }

        const elTtsLanguage = document.getElementById('tts-language');
        if (elTtsLanguage) {
            elTtsLanguage.addEventListener('change', () => {
                stopTTS();
                saveCurrentState();
                translatePageContent();
                translateDropdowns();
                updateTranslatorInfo();
            });
        }

        async function translatePageContent() {
            const langSelect = document.getElementById('tts-language');
            const lang = langSelect ? langSelect.value : 'id-ID';
            const cfg = LANG_CONFIG[lang] || LANG_CONFIG['id-ID'];
            const targetLangCode = cfg.code;

            updateTranslatorInfo();

            // 1. Petunjuk / Hint
            const elHint = document.getElementById('hint-text');
            if (elHint) {
                elHint.innerHTML = cfg.hint;
            }

            // 2. Tombol Navigasi Bawah
            const btnPrev = document.getElementById('btn-prev-uraian');
            const btnNext = document.getElementById('btn-next-uraian');
            if (btnPrev) btnPrev.textContent = cfg.prevBtn;
            if (btnNext) btnNext.textContent = cfg.nextBtn;

            // 3. Judul Sub Header & Meta
            const subTitleEls = document.querySelectorAll('.sub-header-title');
            subTitleEls.forEach(async el => {
                const orig = el.getAttribute('data-original');
                if (orig) {
                    if (targetLangCode === 'id') el.textContent = orig;
                    else el.textContent = await translateTextFree(orig, targetLangCode);
                }
            });

            const subMetaEls = document.querySelectorAll('.sub-header-meta');
            subMetaEls.forEach(el => {
                const count = el.getAttribute('data-count');
                el.textContent = cfg.subMeta(count);
            });

            // 4. Judul Kelompok Uraian & Meta Jumlah Ayat
            const groupTitleEls = document.querySelectorAll('.group-title');
            groupTitleEls.forEach(async el => {
                const orig = el.getAttribute('data-original');
                if (orig) {
                    if (targetLangCode === 'id') el.textContent = orig;
                    else el.textContent = await translateTextFree(orig, targetLangCode);
                }
            });

            const groupMetaEls = document.querySelectorAll('.group-meta');
            groupMetaEls.forEach(el => {
                const count = el.getAttribute('data-count');
                el.innerHTML = cfg.groupMeta(count);
            });

            // 5. Tombol aksi di depan kartu
            const playBtns = document.querySelectorAll('.play-btn');
            playBtns.forEach(btn => {
                if (btn.classList.contains('is-playing')) {
                    const spinnerSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="10" stroke-opacity="0.3"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor"></path></svg>`;
                    btn.innerHTML = spinnerSvg + cfg.playText;
                } else {
                    const svg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
                    btn.innerHTML = svg + cfg.playText;
                }
            });



            const aiBtns = document.querySelectorAll('.ai-btn');
            aiBtns.forEach(btn => {
                const svg = btn.querySelector('svg') ? btn.querySelector('svg').outerHTML : '';
                btn.innerHTML = svg + cfg.aiText;
            });

            // 6. Terjemahan Ayat pada Kartu Flip (di bagian depan)
            const cards = document.querySelectorAll('.flip-card-front');
            if (lang === 'id-ID') {
                cards.forEach(card => {
                    const text = decodeURIComponent(card.getAttribute('data-indo'));
                    const textEl = card.querySelector('.translation-text');
                    if (textEl) {
                        textEl.className = 'translation-text';
                        textEl.textContent = text;
                    }
                    const playBtn = card.querySelector('.play-btn');
                    if (playBtn) playBtn.setAttribute('data-text', encodeURIComponent(text));
                });
                return;
            }
            
            const edition = cfg.edition;
            const cssClass = cfg.cssClass ? ' ' + cfg.cssClass : '';
            
            const promises = Array.from(cards).map(async card => {
                const surah = card.getAttribute('data-surah');
                const ayat = card.getAttribute('data-ayat');
                const textEl = card.querySelector('.translation-text');
                const playBtn = card.querySelector('.play-btn');
                
                if (textEl) {
                    textEl.className = 'translation-text' + cssClass;
                }
                
                const cacheKey = `${edition}:${surah}:${ayat}`;
                if (ayahTranslationCache[cacheKey]) {
                    const translatedText = ayahTranslationCache[cacheKey];
                    if (textEl) textEl.textContent = translatedText;
                    if (playBtn) playBtn.setAttribute('data-text', encodeURIComponent(translatedText));
                    return;
                }
                
                if (textEl) textEl.textContent = cfg.loadingText;
                
                try {
                    const res = await fetch(`https://api.alquran.cloud/v1/ayah/${surah}:${ayat}/${edition}`);
                    const json = await res.json();
                    if (json && json.data && json.data.text) {
                        const translatedText = json.data.text;
                        ayahTranslationCache[cacheKey] = translatedText;
                        if (textEl) textEl.textContent = translatedText;
                        if (playBtn) playBtn.setAttribute('data-text', encodeURIComponent(translatedText));
                    } else {
                        if (textEl) textEl.textContent = cfg.errorText;
                    }
                } catch (e) {
                    console.error(e);
                    if (textEl) textEl.textContent = cfg.connErrorText;
                }
            });
            await Promise.all(promises);
        }
    </script>
</body>
</html>
