<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./quran-app/dist/index.html">
  <title>Mushaf Per Kata - SIMAQ.CLOUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #070b13;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      background-image: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.15) 0%, transparent 60%);
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2.5rem 2rem;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ffffff; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .btn-group { display: flex; flex-direction: column; gap: 0.75rem; }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #082f49;
      font-weight: 700;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(14, 165, 233, 0.35);
      color: #041b2c;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.2s;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Membuka Mushaf Per Kata...</h2>
    <p>Sedang mengalihkan Anda ke modul Mushaf Word-by-Word Interaktif.</p>
    <div class="btn-group">
      <a href="./quran-app/dist/index.html" class="btn-primary">Buka Mushaf Per Kata Sekarang →</a>
      <a href="../index.html" class="btn-secondary">← Kembali ke Portal Utama SIMAQ</a>
    </div>
  </div>
  <script>
    window.location.replace('./quran-app/dist/index.html');
  </script>
</body>
</html>
